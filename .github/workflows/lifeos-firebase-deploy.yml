name: LifeOS build and Firebase Hosting deploy

on:
  push:
    branches:
      - tushar-lifeos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LifeOS
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Install Firebase CLI
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        run: npm install --global firebase-tools

      - name: Deploy to the existing tusharraut Firebase Hosting target
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting:tusharraut --project personal-mgmt-app --token "$FIREBASE_TOKEN"

      - name: Explain deployment secret requirement
        if: ${{ secrets.FIREBASE_TOKEN == '' }}
        run: |
          echo "Production build succeeded."
          echo "Firebase deployment was skipped because the repository secret FIREBASE_TOKEN is not configured."
          echo "Add a Firebase CI token as a repository secret named FIREBASE_TOKEN to enable automatic deployment."
          echo "Do not commit the token to the repository."
